name: integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly Mon 06:23 UTC — catches headlessvice or sidwizard-driver
    # drift even when no PR has landed.
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: reproduce-from-real-sidwizard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Pull the headlessvice image
        # Pre-pull so the per-tune timeouts inside the test don't have
        # to absorb a multi-hundred-MB image fetch.
        run: docker pull anarkiwi/headlessvice:latest

      - name: Install package and integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[integration]"

      - name: Cache SID-Wizard 1.94 source tarball
        # ~9 MB CSDB tarball — avoids hammering CSDB on every PR.
        # Key is the tarball SHA-256 baked into sidwizard-driver's
        # fetch.py, so a sidwizard-driver upgrade busts the cache.
        uses: actions/cache@v5
        with:
          path: ~/.cache/sidwizard-driver
          key: sidwizard-1.94-with-sources-544e36aff3fe14b7

      - name: Run integration tests
        # Drives sidwizard-driver to capture a fresh reference CSV from
        # the real SID-Wizard binary inside asid-vice, for each of the
        # four reference tunes. Asserts pysidwizard's SWMPlayer output
        # matches every frame × every SID register.
        run: python -m pytest -m integration -ra tests/integration/
