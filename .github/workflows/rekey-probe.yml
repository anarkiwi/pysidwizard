name: rekey-probe
on:
  push:
    branches: [claude/compassionate-wright-9zg595]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Fetch manifest tunes
        run: |
          export PYSID_TUNECACHE=$PWD/.tunecache
          pysid-tune-fetch --tests tests/pathdiff_xfails.json
          python - <<'P'
          import csv, hashlib, json, pathlib
          root = pathlib.Path(".tunecache")
          seen = {}
          for c in json.load(open("tests/pathdiff_xfails.json")):
              seen[c["relpath"]] = max(seen.get(c["relpath"], 1), c["song"])
          with open("tunes.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["md5", "path", "songs", "player"])
              for rel, n in seen.items():
                  w.writerow([hashlib.md5((root / rel).read_bytes()).hexdigest(), rel, n, "SID-Wizard"])
          P
      - name: pathdiff build / rank / xfails --verify
        run: |
          export PYSID_TUNECACHE=$PWD/.tunecache
          python -m pysidtracker.pathdiff build $PWD/.tunecache tunes.csv --work .survey --left 6502 --right format:sidwizard --jobs 2
          python -m pysidtracker.pathdiff rank --work .survey --right format:sidwizard --explain 40
          cp tests/pathdiff_xfails.json /tmp/probe.json
          python -m pysidtracker.pathdiff xfails --work .survey --right format:sidwizard --manifest /tmp/probe.json --top 40 --verify || true
          diff <(python -m json.tool tests/pathdiff_xfails.json) <(python -m json.tool /tmp/probe.json) || true
          python - <<'P'
          import json
          for c in json.load(open("/tmp/probe.json")): print(c["id"], c["key"])
          P
