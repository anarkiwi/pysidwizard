[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysidwizard"
version = "0.3.0"
description = "Pure-Python reader, writer, and player for SID-Wizard SWM modules"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Josh Bailey" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    # 0.9 provides the shared surfaces this package builds on: the ``MemPlayer``
    # player base (``SWMPlayer`` subclasses it), the ``SidFormat`` registry +
    # generic CLI, and the sidtrace oracle test factory. py65 (a transitive
    # pysidtracker dependency) also backs the ``.sid`` reader, which runs a
    # tune's own player to recover exports whose runtime image only materialises
    # once init has run (see pysidwizard.sidreader._build_via_player).
    "pysidtracker>=0.9",
]

[project.optional-dependencies]
# Tools used in CI's lint + unit-test gates. ``zstandard`` decompresses the
# sidtrace oracle's ``.csv.zst`` traces (the ``-m oracle`` job); the unit suite
# fetches the four SWM test tunes directly from the SID-Wizard 1.94 source
# tarball (tests/_swm_cache.py), no external driver needed.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
    "black>=24.0",
    "zstandard>=0.21",
]

# The generic ``pysidtracker`` CLI (info / reglog / wav) discovers SID-Wizard
# through this entry point, so no bespoke console script is shipped.
[project.entry-points."pysidtracker.formats"]
sidwizard = "pysidwizard.formats:FORMAT"

[project.urls]
Homepage = "https://github.com/anarkiwi/pysidwizard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``-n auto`` parallelises the unit suite across CPUs via pytest-xdist. The
# sidtrace oracle comparison (``-m oracle``) needs Docker + network, so it is
# excluded from the default run and driven by its own CI job.
addopts = "-ra -n auto -m 'not oracle'"
markers = [
    "oracle: byte-exact comparison against the sidtrace Docker oracle (opt-in via ``-m oracle``)",
]

[tool.coverage.run]
branch = true
source = ["pysidwizard"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "E501",  # line length — black manages this; we set 100 to be lenient
    "UP007", # keep Optional[T] / Union forms
    "UP035", # keep typing.List / typing.Tuple forms
    "UP006", # same
    "UP045",
    "B007",  # loop var not used in body — common in test stubs
    "E741",  # ambiguous variable names (h, l in hex helpers)
    "B904",  # raise from — we have many legacy raises that don't chain
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # late imports after sys.path tweak

[tool.black]
line-length = 100
target-version = ["py311"]
