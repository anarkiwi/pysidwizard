[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysidwizard"
version = "0.4.1"
description = "Pure-Python reader, writer, and player for SID-Wizard SWM modules"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Josh Bailey" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    # The ``MemPlayer`` base (``SWMPlayer`` subclasses it), the ``SidFormat``
    # registry + generic CLI, the sidtrace oracle test factory, and
    # ``run_init``, which the ``.sid`` reader uses to run a tune's own init
    # (see pysidwizard.sidreader._build_via_player). 0.20 explains oracle mismatches
    # and chases the state behind them (``python -m pysidtracker.whydiff TUNE
    # --format sidwizard --state``). 0.24 adds the survey renderer's
    # ``cadence_info``, the oracle-free ``survey scope`` and the pinned-archive
    # fixture fetch (``fetch_archive_member``) the test suite uses. 0.36 has
    # ``pathdiff`` and its strict-xfail manifest (tests/test_pathdiff.py); 0.38
    # keys Python edges by qualname + statement digest, so line shifts and
    # module splits no longer stale the manifest, and it has the facet
    # registry (``SitePattern`` sites with provenance) and the ``locate()`` layout strategies.
    # 0.43 adds ``pysidtracker.playspec`` and whole-song oracle fixtures (no ``frames=``); 0.46
    # adds ``validate(stop=)``, which proves a spec routine against a stretch of a longer one.
    "pysidtracker>=0.46.0",
]

[project.optional-dependencies]
# Tools used in CI's lint + unit-test gates. ``zstandard`` decompresses the
# sidtrace oracle's ``.csv.zst`` traces (the ``-m oracle`` job); the unit suite
# fetches the four SWM test tunes directly from the SID-Wizard 1.94 source
# tarball (tests/_swm_cache.py), no external driver needed.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
    "black>=24.0",
    "zstandard>=0.21",
]

# The generic ``pysidtracker`` CLI (info / reglog / wav) discovers SID-Wizard
# through this entry point, so no bespoke console script is shipped.
[project.entry-points."pysidtracker.formats"]
sidwizard = "pysidwizard.formats:FORMAT"

[project.urls]
Homepage = "https://github.com/anarkiwi/pysidwizard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pysidwizard = ["*.lark", "specs/*.play"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``-n auto`` parallelises the unit suite across CPUs via pytest-xdist. The
# sidtrace oracle comparison (``-m oracle``) needs Docker + network, so it is
# excluded from the default run and driven by its own CI job.
addopts = "-ra -n auto -m 'not oracle'"
markers = [
    "oracle: byte-exact comparison against the sidtrace Docker oracle (opt-in via ``-m oracle``)",
]

[tool.coverage.run]
branch = true
source = ["pysidwizard"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "E501",  # line length — black manages this; we set 100 to be lenient
    "UP007", # keep Optional[T] / Union forms
    "UP035", # keep typing.List / typing.Tuple forms
    "UP006", # same
    "UP045",
    "B007",  # loop var not used in body — common in test stubs
    "E741",  # ambiguous variable names (h, l in hex helpers)
    "B904",  # raise from — we have many legacy raises that don't chain
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # late imports after sys.path tweak

[tool.black]
line-length = 100
target-version = ["py311"]
